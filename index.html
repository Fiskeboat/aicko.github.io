  { eyebrow: 'ANDRE SPOR · TENK LITT STØRRE', title: 'Hmm, 1.4 meter er langt', text: 'men dette er noe større. Kanskje den passer til mikrobølgeovnen?', image: 'qNRFKe-a', badge: 'Avdeling for store mysterier', caption: 'Jeg måler alt i hundelengder.', aside: 'Aicko har undersøkt kjøkkenet. Ingen smuler ble oversett.' },
  { eyebrow: 'TREDJE SPOR · LITT NÆRMERE VARMEN', title: 'Denne kan være grei til å varme seg om natta,', text: 'eller legge rundt magen når smertene er som verst. Men kanskje Petter trenger noe lignende i hans del av senga?', image: 'fI2tZ8yA', badge: 'Sengefordelingsansvarlig', caption: 'Min del av senga er hele senga.', aside: 'Aicko godkjenner alt som gjør senga enda koseligere.' },
  { eyebrow: 'SISTE SPOR · FØLG SNUТEN'.replace('Т','T'), title: 'En teddy varmeflaske får duge for han.', text: 'Men brrr, det hadde vært godt med noe ekstra varme. Kanskje det skjuler seg en skjult skatt under trappa?', image: 'vWuPwxBR', badge: 'Skattejeger på oppdrag', caption: 'Under trappa? Jeg går først!', aside: 'Nå er du nær. Aicko klarer nesten ikke holde det hemmelig.' },
  { eyebrow: 'TIL MILANA · FRA PETTER', title: 'Tenkte på deg når æ ikke er hos deg,', text: 'gjorde litt research og fant ut at dette kanskje kan hjelpe mot plagene.', extra: 'Så er du varm selv når jeg ikke er her. Utrolig glad i deg Milana <3', image: 'JiqqX95g', badge: 'Oppdrag utført ♡', caption: 'Du fikk skatten. Jeg tok leken.', aside: 'En stor klem fra Petter. Og en våt nuss fra Aicko.' }
];
const intro = { eyebrow: 'ET NYTT MYSTERIUM · DETEKTIV AICKO', title: 'En care-package har landet i leiligheten,', text: 'men den eksploderte og tingene i den har spredd seg overalt... Detektiv Aicko er på saken, med din hjelp så kan man finne alt!', image: 'MO3S_Nbe', badge: 'Detektiv Aicko · klar for oppdrag', caption: 'Jeg har slips. Stol på meg.', aside: 'Alle gode detektiver trenger en modig makker.' };
let current = -1;
const $ = id => document.getElementById(id);
function render(focus = false) {
  const s = current === -1 ? intro : steps[current];
  document.querySelector('.progress').hidden = current === -1;
  $('next').textContent = current === -1 ? 'Jeg er flink og modig. Dette klarer jeg' : 'Jaha? →';
  document.body.dataset.step = current;
  $('eyebrow').textContent = s.eyebrow;
  $('headline').textContent = s.title;
  $('clue').textContent = s.text;
  $('extra').hidden = !s.extra;
  $('extra').textContent = s.extra || '';
  $('aicko').src = photoData[s.image];
  $('aicko').alt = current < 2 ? 'Aicko i slips, klar til å hjelpe med skattejakten' : current === 4 ? 'Aicko har fanget leken sin' : 'Aicko følger spent med';
  $('badge').textContent = s.badge;
  $('caption').textContent = s.caption;
  $('aside').textContent = s.aside;
  $('step-label').textContent = `0${current + 1} / 05`;
  document.querySelectorAll('.progress-track span').forEach((el, i) => el.classList.toggle('done', i <= current));
  document.querySelector('.progress').setAttribute('aria-label', `Steg ${current + 1} av 5`);
  $('next').hidden = current === 4;
  $('back').hidden = current <= 0 || current === 4;
  $('restart').hidden = current !== 4;
  $('music').hidden = current !== 4;
  if (current === 4) {
    const frame = document.createElement('iframe');
    frame.src = 'https://www.youtube.com/embed/UKCSaLrCk6A?autoplay=1&playsinline=1&rel=0';
    frame.title = 'Alan Jackson – Freight Train (Official Audio)';
    frame.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    frame.referrerPolicy = 'strict-origin-when-cross-origin';
    frame.allowFullscreen = true;
    $('player').replaceChildren(frame);
    celebrate();
  } else $('player').replaceChildren();
  $('scene').classList.remove('enter');
  void $('scene').offsetWidth;
  $('scene').classList.add('enter');
  if (focus) { $('headline').focus({preventScroll:true}); window.scrollTo({top:0, behavior:'instant'}); }
}
function celebrate() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let i=0;i<16;i++) {
    const heart=document.createElement('span'); heart.className='heart'; heart.textContent='♡';
    heart.style.left=`${Math.random()*95}%`; heart.style.animationDelay=`${Math.random()*1.8}s`;
    $('hearts').append(heart); setTimeout(()=>heart.remove(),6500);
  }
}
$('next').addEventListener('click',()=>{ if(current<4){current++;render(true);} });
$('back').addEventListener('click',()=>{ if(current>0){current--;render(true);} });
$('restart').addEventListener('click',()=>{current=-1;render(true);});
render();
</script></body>
</html>
